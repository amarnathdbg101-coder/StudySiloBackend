name: Go Backend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Verify Dependencies
        run: |
          go mod download
          go mod verify

      - name: Run Go Vet (Linting)
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v -race ./...

      - name: Build Production Binaries
        run: |
          go build -ldflags="-s -w" -v -o bin/api ./cmd/api
          go build -ldflags="-s -w" -v -o bin/migrate ./cmd/migrate
          go build -ldflags="-s -w" -v -o bin/seed ./cmd/seed
